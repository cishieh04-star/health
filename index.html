<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專業健康好文</title>
    <style>
        * { box-sizing: border-box; touch-action: manipulation; }
        body { 
            font-family: 'Microsoft JhengHei', sans-serif; 
            padding: 20px; 
            max-width: 600px; 
            margin: auto; 
            background-color: #fdf6e3; 
            min-height: 100vh;
            display: flex; 
            flex-direction: column; 
            align-items: center;
        }
        
        .box {
            margin: 10px 0; 
            border-radius: 15px;
            font-weight: bold; 
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex; 
            align-items: center; 
            justify-content: center;
        }
        
        /* 1. 最大標題 */
        .header-box { 
            background: #5d4037; 
            color: #ffffff; 
            font-size: 2.2rem; 
            padding: 20px 40px; 
            width: 100%; 
        }
        
        /* 2. 黃底文字 */
        .category-box { 
            background: #ffe4b5; 
            color: #5d4037; 
            font-size: 1.4rem; 
            padding: 10px 25px; 
            border-radius: 20px; 
            margin: 15px 0; 
        }
        
        /* 3. 綠底按鈕列表 */
        ul { 
            list-style-type: none; 
            padding: 0; 
            margin: 10px 0 0 0; 
            width: 100%; 
            display: flex; 
            flex-direction: column; 
        }
        
        li { 
            width: 100%;
            margin-bottom: 15px; 
        }
        
        .game-link { 
            background: #2e7d32; 
            color: #ffffff; 
            font-size: 1.2rem; 
            cursor: pointer; 
            width: 100%; 
            min-height: 55px; 
            padding: 10px;
            text-decoration: none;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="box header-box">專業健康好文</div>
    <div class="category-box">請選擇您喜歡的主題文章</div>

    <ul id="game-list"></ul>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const games = [
                { name: "睡眠是最好的良藥", file: "sleep.html" },
                { name: "如何讓肌肉幫你抗老化？", file: "muscle.html" }
                
            ];

            const listElement = document.getElementById('game-list');
            
            games.forEach(game => {
                const li = document.createElement('li');
                // 直接將 a 標籤設定為按鈕樣式，減少一層 div 巢狀衝突
                li.innerHTML = '<a href="' + game.file + '" class="game-link">' + game.name + '</a>';
                listElement.appendChild(li);
            });
        });
    </script>
</body>
</html>
